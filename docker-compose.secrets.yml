# ============================================================================
# genai-deploy-onpre: docker secrets オーバーレイ（セキュリティハードニング、opt-in）
#   秘密値を docker secrets で扱う。
#
# 使い方:
#   1. secret ファイルを用意（手動、.gitignore）。`scripts/gen-secrets.sh` で生成可能:
#        ./scripts/gen-secrets.sh
#      → secrets/postgres_password / secrets/keycloak_db_password / secrets/keycloak_admin_password
#   2. base に重ねて起動:
#        docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# 本オーバーレイは base の環境変数パスワードを secret ファイル経由へ切り替える。
#   - postgres / keycloak-db : POSTGRES_PASSWORD_FILE（公式イメージのネイティブ _FILE 対応）
#   - keycloak               : _FILE 非対応のため entrypoint ラッパで secret を env へ注入
# base のパスワード env は空文字で上書きし、_FILE との衝突を回避する。
#
# secret ファイルの権限（重要・実機検証で確認）:
#   file ベース docker secret は source ファイルの権限のまま bind マウントされる。
#   Keycloak は非 root（uid 1000）でラッパが secret を読むため、secrets/* は mode 644 とし、
#   secrets/ ディレクトリ 700 でホスト側アクセスを制限する（gen-secrets.sh がこれを設定）。
#   600 だとホスト uid ≠ 1000 の環境で Keycloak が Permission denied になる。
# ============================================================================

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  # ハードニング拡充：自前イメージ（api/worker）は _FILE 規約をアプリで対応。
  keycloak_admin_client_secret:
    file: ./secrets/keycloak_admin_client_secret
  s3_secret_access_key:
    file: ./secrets/s3_secret_access_key

services:
  postgres:
    environment:
      # 空で base の値を上書き → _FILE と非衝突（postgres は空 env を無視し _FILE を使う）
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  keycloak-db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password

  keycloak:
    # Keycloak は _FILE 非対応。entrypoint ラッパで secret ファイルを読み env へ注入してから
    # 公式 kc.sh を exec する（base の command が "$@" として渡る）。
    # 注：compose は $ を補間するため、コンテナへリテラル $ を渡すには $$ と書く（$$(...) / $${@}）。
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_DB_PASSWORD="$$(< /run/secrets/keycloak_db_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(< /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh "$${@}"
      - keycloak-secrets-wrapper
    environment:
      # base のソフト値を空で上書き（ラッパが secret から再注入する）
      KC_DB_PASSWORD: ""
      KC_BOOTSTRAP_ADMIN_PASSWORD: ""
    secrets:
      - keycloak_db_password
      - keycloak_admin_password

  # migrate：base entrypoint を上書きし、POSTGRES_PASSWORD を _FILE から再注入してから DATABASE_URL を
  # 組み立てる。base は ${POSTGRES_PASSWORD} を compose 展開時に焼く構造のため
  # overlay 適用時は env を空に上書きし、コンテナ起動時に _FILE から URL エンコード再構築する。
  migrate:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        export POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$$(node -e 'process.stdout.write(encodeURIComponent(process.env.POSTGRES_PASSWORD || ""))')@postgres:5432/$${POSTGRES_DB}"
        exec npx prisma migrate deploy
    secrets:
      - postgres_password

  # api：自前イメージ＝アプリが _FILE 規約を解決（readSecretEnv）。base の平文 env を空で上書きし
  # _FILE 経由（/run/secrets）へ切り替える。Keycloak Admin REST client secret ＋ SeaweedFS S3 secret。
  # 加えて：base が compose 展開時に焼く DATABASE_URL を空で打ち消し、entrypoint ラッパで
  # POSTGRES_PASSWORD を _FILE から再注入＋URL エンコードして再構築（migrate と同様、$@ で Dockerfile CMD を起動）。
  api:
    environment:
      KEYCLOAK_ADMIN_CLIENT_SECRET: ""
      KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_admin_client_secret
      S3_SECRET_ACCESS_KEY: ""
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      POSTGRES_USER: ${POSTGRES_USER:-genai}
      POSTGRES_DB: ${POSTGRES_DB:-genai}
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ""
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$$(node -e 'process.stdout.write(encodeURIComponent(process.env.POSTGRES_PASSWORD || ""))')@postgres:5432/$${POSTGRES_DB}"
        exec "$$@"
      - api-secrets-wrapper
    # compose で entrypoint を上書きすると Dockerfile の CMD は引き継がれない（Docker 仕様）。
    # base に api 用 command が無いため、Dockerfile CMD を明示復元する（worker は base で command 指定済）。
    command: ['node', 'dist/index.js']
    secrets:
      - keycloak_admin_client_secret
      - s3_secret_access_key
      - postgres_password

  # worker：S3 のみ使用（Keycloak Admin REST は worker 経路で不使用＝base に当該 env なし）。
  # api と同方式で DATABASE_URL も _FILE 化（worker は base command で dist/workers/main.js を指定済み）。
  worker:
    environment:
      S3_SECRET_ACCESS_KEY: ""
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      POSTGRES_USER: ${POSTGRES_USER:-genai}
      POSTGRES_DB: ${POSTGRES_DB:-genai}
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL: ""
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$$(node -e 'process.stdout.write(encodeURIComponent(process.env.POSTGRES_PASSWORD || ""))')@postgres:5432/$${POSTGRES_DB}"
        exec "$$@"
      - worker-secrets-wrapper
    secrets:
      - s3_secret_access_key
      - postgres_password
