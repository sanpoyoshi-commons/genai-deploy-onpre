# ============================================================================
# genai-deploy-onpre: ElasticMQ 設定（SQS 互換キュー）
#   用途  : 外部アプリ非同期実行ポーリング機能（メインキュー + DLQ）
#   接続  : api が AWS SDK (client-sqs) のエンドポイントを本サービスへ差替
#
# 注意: 永続化キー・設定ファイル自動読込先は softwaremill/elasticmq:1.7.1
#   に対する推定を含む。初回 `docker compose --profile queue up -d elasticmq` の起動ログで
#   「設定読込・キュー生成・永続化有効」を確認すること。差異があれば修正する。
# ============================================================================

include classpath("application.conf")

# 生成されるキュー URL のホスト部。内部ネットワークのサービス名 elasticmq で解決させる。
node-address {
    protocol = http
    host = "elasticmq"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    # SQS API の制限を厳格適用（アプリが依存する SQS セマンティクスとの整合）
    sqs-limits = strict
}

# --- キュー事前定義（外部アプリ非同期ポーリング） --------------------------------
# メインキュー genai-exapp-async と DLQ genai-exapp-async-dlq。
# DLQ maxReceiveCount = 1000。
# 可視性タイムアウト等の動的制御（疑似ロングポーリング）は api ワーカーが
# ChangeMessageVisibility で実施。本 conf は基盤定義に留める。
queues {
    genai-exapp-async-dlq { }

    genai-exapp-async {
        deadLettersQueue {
            name = "genai-exapp-async-dlq"
            maxReceiveCount = 1000
        }
    }

    # --- 文字起こし非同期ジョブ（faster-whisper） ---
    # worker（pollTranscriptionStatus）が受信中に同期で Whisper を呼ぶ（CPU 推論は長尺で数分）。
    # その処理時間を可視性タイムアウトが下回ると処理中に再配信され二重処理になるため長め（900s）に設定する
    # （DB は jobName 冪等で最終整合するが無駄な再実行を抑える）。恒久エラーは worker が FAILED 確定して
    # メッセージを削除＝再配信されない。一過性エラーのみ再配信され maxReceiveCount で頭打ち（外部アプリ用の 1000 と
    # 異なり 5＝長時間ジョブの暴走再試行を防ぐ）。
    genai-transcribe-async-dlq { }

    genai-transcribe-async {
        defaultVisibilityTimeout = 900 seconds
        deadLettersQueue {
            name = "genai-transcribe-async-dlq"
            maxReceiveCount = 5
        }
    }
}

# --- 永続化 --------------------------------------------------
# ElasticMQ は既定 in-memory。再起動で非同期ジョブが消失しないよう永続化を有効化。
# 永続化 DB ファイルは elasticmq_data ボリューム（/data）に置く想定。
# ※ 保存先パス指定キーはバージョン依存。起動後にファイルが /data に出来るか確認すること。
messages-storage {
    enabled = true
}
