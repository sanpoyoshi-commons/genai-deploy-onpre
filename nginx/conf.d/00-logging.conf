# genai-deploy-onpre — nginx access_log 構造化 JSON 化
#
# 目的:
#   1. access_log を 1 行 JSON に統一（pino-http / structlog と同スキーマ）→ Dozzle / logs.sh で
#      hop を時系列に並べて検索可能にする。
#   2. request_id を hop 横断トレース用に全 server で出力。
#      クライアントが X-Request-Id を送ってこない場合は nginx が生成（$request_id、nginx 1.11.0+）。
#      proxy_set_header X-Request-Id $req_id は default.conf 側で api / auth に転送。

# クライアント送信があれば優先、無ければ nginx 生成 ID にフォールバック
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# 統一 JSON 1 行（pino: level/time/body/service/component/event/request_id と同形）。
# escape=json は nginx 1.11.8+。本配布の同梱版（1.30 系 alpine）で対応済み。
log_format genai_json escape=json
    '{'
    '"time":"$time_iso8601",'
    '"service":"nginx",'
    '"level":"INFO",'
    '"component":"nginx.access",'
    '"event":"request_completed",'
    '"request_id":"$req_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"body":"request completed"'
    '}';

# access_log を http コンテキストで宣言すると nginx 公式イメージ既定の `combined` 形式と二重出力に
# なるため、各 server ブロック内で `access_log /var/log/nginx/access.log genai_json;` と書いて上書きする
# （server コンテキスト指示は http コンテキスト指示を完全に置き換える）。
# default.conf 側の各 server に access_log を配置済。
