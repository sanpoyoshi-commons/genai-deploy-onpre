# genai-deploy-onpre — nginx リバースプロキシ / TLS termination
# 外部 TLS（client→nginx 自己署名 HTTPS）＋ 内部 TLS（nginx↔api）。
# 証明書は scripts/gen-certs.sh が ./certs に生成し /etc/nginx/certs に read-only マウント。

# api への内部 TLS upstream（コンテナ名で DNS 解決）
upstream api_upstream {
    server api:3443;
}

# --- 内部 healthcheck 用（コンテナ内 127.0.0.1:8080、外部非公開） ---
server {
    listen 8080;
    server_name _;
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}

# --- HTTP(80) → HTTPS(443) リダイレクト ---
server {
    listen 80;
    server_name _;
    # 統一 JSON access_log（00-logging.conf の log_format genai_json）。
    access_log /dev/stdout genai_json;
    return 301 https://$host$request_uri;
}

# --- HTTPS(443) 本体 ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 統一 JSON access_log。
    access_log /dev/stdout genai_json;

    # 外部向けサーバ証明書（自己署名、各端末で rootCA 信頼登録 → README 参照）
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # アップロードサイズ（ファイルアップロード想定）
    client_max_body_size 100m;

    # 実行時アプリ設定（on-premise モデルメニュー可変化）。
    # entrypoint が .env の MODEL_IDS / IMAGE_GENERATION_MODEL_IDS から envsubst で
    # 生成した config.js（window.__APP_CONFIG__ を同期セット）を配信する。html は
    # read-only マウントのため書込可パス（/var/lib/genai-web）から alias する。
    # exact match（=）で最優先評価。再 build 不要でモデル一覧を切り替える導線。
    location = /config.js {
        alias /var/lib/genai-web/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        access_log off;
    }

    # web 静的配信（dist を ./web から read-only マウント）
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API プロキシ（/api/* → api コンテナへ内部 TLS）。
    # api は app.use('/api', ...) で /api プレフィックスを期待するため、proxy_pass に URI を付けない
    # （末尾スラッシュなし＝原 URI /api/... をそのまま透過。スラッシュ付きは /api を strip して 404 になる）。
    location /api/ {
        proxy_pass https://api_upstream;

        # 内部 TLS：api の自己署名証明書を内部 CA で検証
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name         api;
        proxy_ssl_server_name  on;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # request_id を hop 横断トレース用に api へ伝搬
        # （クライアント送信があれば優先、無ければ 00-logging.conf の map で nginx が生成）。
        proxy_set_header X-Request-Id      $req_id;

        # LLM ストリーミング（/api/predict/stream の JSONL/SSE）対応。
        # ローカル CPU 推論はモデルのコールドロード（7B で ~50 秒）＋逐次生成で
        # 既定 proxy_read_timeout 60 秒を容易に超え 504 になるため大幅に延長する。
        # 大きいプロンプト（ダイアグラム生成 ~7-8K トークン）は CPU プレフィルだけで
        # 10 分超かかり、その間は 1 トークンも流れない（無通信）。プレフィル完了前に
        # 接続が切れないよう、api 側 LLM_DEFAULT_TIMEOUT_MS（30分）と整合させる。
        # またバッファを無効化してチャンクを即時クライアントへ flush する（逐次描画）。
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 認証（Keycloak）。realm/hostname 設計でルーティング精緻化予定（現状プレースホルダ）。
    location /auth/ {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        # request_id を hop 横断トレース用に keycloak へ伝搬。
        proxy_set_header X-Request-Id      $req_id;
    }
}

# --- S3（SeaweedFS）専用エンドポイント（FileStorage 実配線） ---
# presigned URL の SigV4 は「署名 host＋path」と「ブラウザ実 URL」と「SeaweedFS 受信値」の一致を要する。
# path-prefix（/s3）を strip するとパス不一致で 403 になるため、prefix を使わず専用ポートで素通しする。
# api は S3_PUBLIC_ENDPOINT=https://<host>:8443 で署名し、ここは Host を保持して seaweedfs:8333 へ透過する
# （Host=localhost:8443 が SeaweedFS の SigV4 検証 host と一致）。ブラウザが presigned URL で直接 up/download。
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # 統一 JSON access_log。
    access_log /dev/stdout genai_json;

    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 大容量アップロード（presigned PUT がここを通る）。0=無制限（上限は SeaweedFS 側で管理）。
    client_max_body_size 0;

    location / {
        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;
        # Host はポート込みでそのまま透過する（SigV4 host 一致に必須）。$host はポートを落とすため
        # 署名 host（localhost:8443）と受信 host（localhost）が食い違い 403 になる。$http_host は原値（ポート込み）。
        # path も rewrite しない（prefix なし）。
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # S3 SigV4 検証経路にも request_id を伝搬（presigned URL の hop 観察用）。
        # 注：SigV4 の署名対象に X-Request-Id は含めないため後段 SeaweedFS 側で検証通過する。
        proxy_set_header X-Request-Id    $req_id;
        # リクエストはバッファして Content-Length 付きで送る（SeaweedFS PutObject は chunked を弾き 400 になるため
        # proxy_request_buffering off にしない）。レスポンスはストリーミング（大容量ダウンロードをバッファしない）。
        proxy_buffering off;
    }
}
