# ============================================================================
# NsJail 設定（protobuf テキスト形式）— genai サンドボックス
#   隔離対象 : LLM が生成した「敵対的」Python コード（CSV/Excel→pandas→matplotlib）。
#   方針     : network off ＋ rootfs read-only ＋ 書込可 tmpfs ＋ 時間/メモリ/プロセス上限 ＋
#              jail 内 uid を nobody(65534) に落とす。作業ディレクトリは server.py が
#              `--bindmount <workdir>:/sandbox` で動的に rw 付与し、time_limit も CLI で上書きする。
#
#   実機 PoC 確定済（2026-06-02）: user-namespace 化の可否・最小 CAP・seccomp 緩和要否は実機検証で確定し、
#      本ファイルと docker-compose.yml の sandbox ブロックへ反映済。詳細は docs/sandbox-poc-runbook.md 確定値表。
# ============================================================================

name: "genai-sandbox"
description: "CSV/Excel -> pandas -> matplotlib chart. Runs untrusted, LLM-generated Python."

mode: ONCE
hostname: "sandbox"
cwd: "/sandbox"

# --- user namespace は使わない（PoC 実機確定 2026-06-02）。
#     理由: 本番ターゲット（WSL2/Docker・rootful runc）はネストした user namespace の uid_map/gid_map 書込を
#     カーネルが一律 EPERM で拒否する（`unshare -Ur` 単体でも再現）。userns 化＝CAP ゼロ化は本環境で不可。
#     代替として mount/pid/net/ipc/uts/cgroup namespace ＋ setuid で nobody(65534) に落として隔離する
#     （uid/gid は server.py が --user/--group で渡す）。 ---
clone_newuser: false

# --- ネットワーク完全遮断（新規 net namespace・loopback も上げない＝NET_ADMIN 不要） ---
clone_newnet: true
iface_no_lo: true

# --- 時間/資源上限（time_limit は server.py が --time_limit で上書き） ---
time_limit: 8
rlimit_as: 1024        # 仮想メモリ MB（pandas/matplotlib のピーク。PoC で調整）
rlimit_cpu: 12         # CPU 秒
rlimit_fsize: 16       # 生成ファイル MB 上限
rlimit_nofile: 256
rlimit_nproc: 64

# --- jail 内ユーザを nobody に落とす。userns 不使用のため uidmap/gidmap ではなく setuid で落とす
#     （server.py が `--user 65534 --group 65534` を渡す。CAP_SETUID/CAP_SETGID を要する）。 ---

# --- 子プロセスに渡す環境変数（nsjail は既定で環境を継承しないため明示） ---
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "MPLBACKEND=Agg"
# matplotlib は read-only な baked フォントキャッシュを使う（per-run の再構築を避ける）。
envar: "MPLCONFIGDIR=/opt/sandbox/mpl"
envar: "MATPLOTLIBRC=/opt/sandbox/matplotlibrc"

# --- マウント: rootfs を read-only で丸ごと bind（python ランタイム/ライブラリ/フォントが見える）。
#     書込可は tmpfs /tmp と、CLI で渡る作業ディレクトリ /sandbox のみ。 ---
mount { src: "/"        dst: "/"        is_bind: true  rw: false  mandatory: true }
mount { dst: "/tmp"     fstype: "tmpfs" rw: true  options: "size=64m" }
mount { dst: "/dev/shm" fstype: "tmpfs" rw: true  options: "size=64m" }

# proc は pandas/numpy が CPU 数等の取得で参照する場合がある。最小で新規 proc をマウント（PoC で要否確認）。
mount_proc: true

# seccomp（PoC 実機確定 2026-06-02・後続ハードニング① 実装 2026-06-02）:
# 本環境では Docker 既定 seccomp が CAP_SYS_ADMIN 保持下でも nsjail の pivot_root を EPERM で阻むため、
# compose 側で seccomp=unconfined を付与している（理由・代償は docs/sandbox-threat-model.md）。その代償
# （子→ホストカーネルの syscall 攻撃面拡大）を、nsjail 内側の kafel seccomp で補償する。
# nsjail はセットアップ（pivot_root/mount/setuid）完了後・exec 直前に本ポリシーを子へ適用するため、
# nsjail 自身のセットアップ syscall は阻害されない（子側のみ DEFAULT ALLOW のデナリストで制限）。
seccomp_policy_file: "/opt/sandbox/seccomp.policy"
